# Simulation CI target list, consumed by .github/workflows/sim-ci.yml's load-config job.
# Every entry must set all of these keys (fail_ok/coverage_scope/fw_test included) so the
# matrix entries GitHub Actions builds via fromJson() have a uniform shape.
#
#   name:            short label used for the metrics/artifact/job name
#   group:           lint | directed_tb | pyuvm - which section of the aggregated
#                       metrics.csv/summary.md this target's row lands in. Groups are
#                       emitted in that order (see report_target.GROUPS), targets
#                       sorted by name within a group.
#   core:            FuseSoC CAPI2 VLNV, e.g. sharc:comms_ip:ahb_uart
#   fusesoc_target:  target within that core's .core file
#   kind:            cocotb | log-grep | exit-code (see .github/scripts/ci/report_target.py)
#   fusesoc_args:    extra flags passed to `fusesoc run`, "" if none
#   success_pattern: required text in the captured log, kind: log-grep only, else ""
#   fail_ok:         true = failures don't block CI (shown yellow, not red);
#                     the real pass/fail is still recorded in the metrics either way
#   coverage_scope:  full = report every coverage category (line/toggle/branch/expr/
#                       fsm_state/fsm_arc); line = report only line coverage, the rest
#                       recorded as "N/A"; none = no coverage at all, everything "N/A"
#                       (use for targets with no coverage.dat, e.g. a lint-only target)
#   fw_test:         value of FW_TEST for the run, naming a firmware top level in
#                       sw/tests (see sw/scripts/build_fw.sh --list). "" for every
#                       target that isn't a top-level software test - build_fw.sh
#                       then uses the default sw/src/main.c. Anything with a
#                       build_fw pre_build hook needs the RISC-V toolchain in the
#                       container image (.github/docker/sim/Dockerfile).

targets:
  # --- Lint ----------------------------------------------------------------
  # Cheap, and catches an unelaboratable block before any of the slow legs run.

  - name: grouper_soc_lint
    group: lint
    core: sharc:soc_ip:grouper_soc
    fusesoc_target: lint
    kind: exit-code
    fusesoc_args: "--build"
    success_pattern: ""
    fail_ok: false
    coverage_scope: none
    fw_test: ""

  - name: ahb_uart_lint
    group: lint
    core: sharc:comms_ip:ahb_uart
    fusesoc_target: lint
    kind: exit-code
    fusesoc_args: "--build"
    success_pattern: ""
    fail_ok: false
    coverage_scope: none
    fw_test: ""

  - name: ahb_gpio_ctrl_lint
    group: lint
    core: sharc:comms_ip:ahb_gpio_ctrl
    fusesoc_target: lint
