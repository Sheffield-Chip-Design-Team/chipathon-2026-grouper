    fw_test: ""

  - name: ahb_qspi_lint
    group: lint
    core: sharc:comms_ip:ahb_qspi
    fusesoc_target: lint
    kind: exit-code
    fusesoc_args: "--build"
    success_pattern: ""
    fail_ok: false
    coverage_scope: none
    fw_test: ""

  - name: ahb_spi_m_lint
    group: lint
    core: sharc:comms_ip:ahb_spi_m
