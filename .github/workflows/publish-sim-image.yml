name: Publish Simulation Image

on:
  push:
    branches: [main]
    paths:
      - .github/docker/sim/**
      - .github/verilator-version
      - .github/riscv-toolchain-version
      - .github/workflows/publish-sim-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: version
        run: |
          verilator_version="$(cat .github/verilator-version)"
          riscv_version="$(cat .github/riscv-toolchain-version)"
          echo "verilator=$verilator_version" >> "$GITHUB_OUTPUT"
          echo "riscv=$riscv_version" >> "$GITHUB_OUTPUT"
          # The tag covers BOTH pinned tools, so bumping either one publishes a
          # new image and sim-ci.yml (which composes the identical tag) picks it
          # up. Tagging on the Verilator version alone used to mean a change to
          # anything else in the image - the RISC-V toolchain, say - silently
          # reused the old tag and CI kept pulling a stale image.
          echo "tag=${verilator_version}-riscv${riscv_version}" >> "$GITHUB_OUTPUT"
          # ghcr.io requires a lowercase path; github.repository preserves case
          # (e.g. Sheffield-Chip-Design-Team/... ), so lowercase it ourselves.
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/sim-verilator" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .github/docker/sim
          build-args: |
            VERILATOR_VERSION=${{ steps.version.outputs.verilator }}
            RISCV_TOOLCHAIN_VERSION=${{ steps.version.outputs.riscv }}
          push: true
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.tag }}
            ${{ steps.version.outputs.image }}:latest
