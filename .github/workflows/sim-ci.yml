name: Simulation CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  load-config:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.load.outputs.matrix }}
      verilator-image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - id: load
        run: |
          python3 -c "
          import yaml, json
          cfg = yaml.safe_load(open('.github/sim-ci-targets.yaml'))
          print('matrix=' + json.dumps(cfg['targets']))
          " >> "$GITHUB_OUTPUT"
      - id: image
        run: |
          # ghcr.io requires a lowercase path; github.repository preserves case.
          repo_lower="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          # Must match the tag composed in publish-sim-image.yml exactly.
          tag="$(cat .github/verilator-version)-riscv$(cat .github/riscv-toolchain-version)"
          echo "image=ghcr.io/${repo_lower}/sim-verilator:${tag}" >> "$GITHUB_OUTPUT"

  sim:
    name: run ${{ matrix.name }}
    needs: load-config
    continue-on-error: ${{ matrix.fail_ok }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.load-config.outputs.matrix) }}
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.load-config.outputs.verilator-image }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sim-env

      - name: Run and report ${{ matrix.name }}
        env:
          # Picks the firmware top level from sw/tests for the software-test
          # legs (see sw/scripts/build_fw.sh). Empty for every other target,
          # which build_fw.sh treats as "use the default sw/src/main.c".
          FW_TEST: ${{ matrix.fw_test }}
        run: |
          python3 .github/scripts/ci/run_target.py \
            --name "${{ matrix.name }}" \
            --core "${{ matrix.core }}" \
            --fusesoc-target "${{ matrix.fusesoc_target }}" \
            --kind "${{ matrix.kind }}" \
            --group "${{ matrix.group }}" \
            --fail-ok "${{ matrix.fail_ok }}" \
            --fusesoc-args="${{ matrix.fusesoc_args }}" \
            --success-pattern="${{ matrix.success_pattern }}" \
            --coverage-scope="${{ matrix.coverage_scope }}" \
            --out-dir ci-results

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.name }}
          path: ci-results/

  metrics:
    needs: sim
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download all per-target results
        uses: actions/download-artifact@v4
        with:
          path: all-results
          pattern: results-*

      - name: Aggregate metrics
        run: python3 .github/scripts/ci/aggregate_metrics.py --results-dir all-results --out-dir sim-metrics

      # Renders on the run's own page, so results are readable without
      # downloading the artifact or opening each matrix job's log.
      - name: Publish simulation summary
        if: always()
        run: |
          if [ -f sim-metrics/summary.md ]; then
            cat sim-metrics/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            # Aggregation itself failed (e.g. no metrics-*.json at all) - say so
            # here rather than leaving the run page blank.
            echo "## Simulation CI summary" >> "$GITHUB_STEP_SUMMARY"
            echo "No summary was produced - see the 'Aggregate metrics' step." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload sim-metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-metrics
          path: sim-metrics/
