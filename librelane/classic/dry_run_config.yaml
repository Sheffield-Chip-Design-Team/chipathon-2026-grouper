# GF180MCU LibreLane config -- classic flow, DRY RUN of the chip_core macro.
#
# Characterizes area, congestion and timing for the SoC (CPU, UART,
# interconnect, io_ss, RAM, ROM) in an 1100x1100 slot WITHOUT the hardened
# gf180mcu_ocd_ip_sram macros. The differences from config.yaml, all driven by
# the DRY_RUN define below:
#
#   - RAM: hw/rtl/memory/ahb_ram.sv builds counters on the address and data
#     lines instead of a memory array, standing in for the absent SRAMs while
#     keeping the RAM leg of the fabric alive through synthesis.
#   - ROM: hw/rtl/memory/ahb_rom.sv shrinks to 64 B, holding only the boot stub
#     in sw/dry_run/rom_boot.S, which jumps to the RAM window on reset.
#   - SPI slave: replaced by ahb_stub_slave; QSPI and SPI master were already
#     stubs.
#   - No MACROS block, and its own PDN script (dry_run_pdn_cfg.tcl) with the
#     sram_grid removed.
#
# Everything else is the proven `irdrop_check_d` recipe from config.yaml -- see
# TRIAL_NOTES.md.
meta:
  version: 3
  flow: Classic
  substituting_steps:
    # Skip Yosys unmapped cells check as it incorrectly flags submodules due to them starting with $ (e.g. $paramod$...)
    # Also even if it didn't flag it, it wouldn't check submodules for unmapped cells
    # Checker.YosysUnmappedCells: null

    # Ignore yosys warnings about signal used by no driver
    # Warning: Wire $paramod$1.../small_sync_fifo.sv:53$1261 [31] is used but has no driver.
    # TODO: figure out why yosys is sad
    # Checker.YosysSynthChecks: null

    # Why is this checker broken?
    # Probably submodules???????
    # OpenROAD.CheckMacroInstances: null

    # Disable KLayout DRC
    Checker.KLayoutDRC: null

    # Disable KLayout antenna check
    #Checker.KLayoutAntenna: null
    # Disable KLayout density check
    #KLayout.Density: null
    #Checker.KLayoutDensity: null

    # Save time during development
    # Enable for sign-off
    #OpenROAD.IRDropReport: null
    #Magic.DRC: null
    #Checker.MagicDRC: null
    KLayout.XOR: null
    #Netgen.LVS: null
    #Checker.LVS: null

DESIGN_NAME: grouper_soc_chip_core

VERILOG_FILES:
# GrouperSoC RTL (same order as the fusesoc `rtl` fileset in grouper_soc.core)
- dir::../../hw/rtl/ahb3lite/ahb3lite_pkg.sv

- dir::../../hw/rtl/common/clk_div.sv
- dir::../../hw/rtl/common/clk_gate.sv
- dir::../../hw/rtl/common/clk_out.sv
- dir::../../hw/rtl/common/downcounter.sv
- dir::../../hw/rtl/common/pulse_sync.sv
- dir::../../hw/rtl/common/shift_reg.sv
- dir::../../hw/rtl/common/small_sync_fifo.sv
- dir::../../hw/rtl/common/sync.sv

- dir::../../ip/picorv32/picorv32.v

- dir::../../hw/rtl/uart/uart_clk_div.sv
- dir::../../hw/rtl/uart/uart_rx.sv
- dir::../../hw/rtl/uart/uart_tx.sv
- dir::../../hw/rtl/uart/uart.sv
- dir::../../hw/rtl/uart/ahb_uart.sv

- dir::../../hw/rtl/gpio/gpio_ctrl_pkg.sv
- dir::../../hw/rtl/gpio/ahb_gpio_ctrl.sv

- dir::../../hw/rtl/memory/ahb_rom.sv
- dir::../../hw/rtl/memory/ahb_ram.sv

- dir::../../hw/rtl/interconnect/ahb_conn_buff.sv
- dir::../../hw/rtl/interconnect/ahb_stub_slave.sv

- dir::../../hw/rtl/ahb_interconnect_ss.sv
- dir::../../hw/rtl/io_ss.sv
- dir::../../hw/rtl/cpu_ss.sv
- dir::../../hw/rtl/periph_ss.sv
- dir::../../hw/rtl/digital_ss.sv
- dir::../../hw/rtl/grouper_soc_top.sv

# CHIP core wrapper
- dir::../../hw/pd/grouper_soc_chip_core.sv

VERILOG_INCLUDE_DIRS:
# Supplies code.vmem -- the boot stub built by sw/scripts/build_rom_boot.sh.
# ahb_rom.sv includes `PROG_FILE_VMEM, which defaults to "code.vmem", so
# pointing the include path at sw/dry_run is what selects the boot stub over
# the full firmware image in sw/.
- dir::../../sw/dry_run

VERILOG_DEFINES:
# Counter RAM, 64 B boot ROM, SPI slave stubbed out. See the header above.
- DRY_RUN
# Build the ROM contents from code.vmem (continuous assigns) rather than
# $readmemh, which has no synthesisable equivalent - standard cells have no
# initial-value mechanism, so this is what actually produces a mask ROM.
- ROM_INIT_CONST

# Enable plugin for better SystemVerilog support

USE_SLANG: true
SLANG_ARGUMENTS: ['--keep-hierarchy']

# SYNTH_HIERARCHY_MODE: keep
SYNTH_AUTONAME: true # human readable names
SYNTH_SIZING: true
SYNTH_ABC_DFF: true
# SYNTH_ABC_USE_MFS3: true
SYNTH_STRATEGY: "DELAY 2"

# 1100x1100 dry-run slot. Smaller than the 1310x1150 signoff baseline because
# the four SRAM macros (621,654 um^2 of fixed footprint) are gone, along with
# the 512x32 flop array the behavioural RAM used to infer and half the CPU
# register file (RV32E). The congestion-mitigation settings below are still the
# proven `irdrop_check_d` recipe -- see TRIAL_NOTES.md.
FP_SIZING: absolute
DIE_AREA: [0.0, 0.0, 1100, 1100]

# Slightly smaller file sizes
PRIMARY_GDSII_STREAMOUT_TOOL: klayout

# SDC files
# Constrains chip_core's own ports. grouper_chip_core.sdc next to this file
# constrains the *_PAD names of chip_top instead, which do not exist here.
PNR_SDC_FILE:     dir::dry_run.sdc
SIGNOFF_SDC_FILE: dir::dry_run.sdc
FALLBACK_SDC:     dir::dry_run.sdc

# Power / ground nets
VDD_NETS:
  - VDD
GND_NETS:
  - VSS

# Clock -- direct port on this macro, no I/O pad in this flow
CLOCK_PORT: clk
CLOCK_PERIOD: 62.5 # 16MHz

# Routing / ESD
DIODE_ON_PORTS: in

# Moved to Metal5 to relieve Metal3 congestion at 1310x1150 (see TRIAL_NOTES.md).
# Normally capped at Metal4 because Metal5 is reserved for the parent's core
# ring in hierarchical integration (PDN_CORE_RING: false below) -- Metal5
# ownership still needs to be cleared with the parent integration owner.
RT_MAX_LAYER: Metal5

CTS_OBSTRUCTION_AWARE: true
CTS_DELAY_BUFFER_DERATE_PCT: 100
CTS_BALANCE_LEVELS: true
CTS_CLK_MAX_WIRE_LENGTH: 0
CTS_DISTANCE_BETWEEN_BUFFERS: 0
CTS_SINK_CLUSTERING_SIZE: 20
CTS_SINK_CLUSTERING_MAX_DIAMETER: 60
CTS_APPLY_NDR: none

# Cell names in this library are clkbuf_<N>, not clkbuf_x<N>.
# The "X12" in the datasheet title is the drive-strength description,
# not part of the cell name. Give CTS more than one size to pick from.
CTS_CLK_BUFFERS:
  - "gf180mcu_fd_sc_mcu7t5v0__clkbuf_4"
  - "gf180mcu_fd_sc_mcu7t5v0__clkbuf_8"
  - "gf180mcu_fd_sc_mcu7t5v0__clkbuf_12"
  - "gf180mcu_fd_sc_mcu7t5v0__clkbuf_16"

# Fix hold violations
PL_RESIZER_HOLD_SLACK_MARGIN: 0.6
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.5

# Pre-routing setup repair (fixes timing before route guides exist, unlike
# the RUN_POST_GRT_* flags which are gated off by default and hung on this
# design's tighter density -- see TRIAL_NOTES.md). Modeled on the adjacent
# trouper repo's RUN_POST_GPL_DESIGN_REPAIR / GRT_RESIZER_SETUP_MAX_BUFFER_PCT.
RUN_POST_GPL_DESIGN_REPAIR: true
RUN_POST_CTS_RESIZER_TIMING: true
PL_RESIZER_SETUP_MAX_BUFFER_PCT: 40

# Placement
# The 1310x1150 `irdrop_check_d` baseline used 68% target density and a
# relaxed fanout limit to avoid excessive buffering.
PL_TARGET_DENSITY_PCT: 45
MAX_FANOUT_CONSTRAINT: 16
GRT_ALLOW_CONGESTION: false
GRT_ADJUSTMENT: 0.2
GPL_CELL_PADDING: 2
DPL_CELL_PADDING: 2

# The library's *delay* buffers, built to have high intrinsic delay (~2.5-2.8ns
# even unloaded) for hold fixing. Nothing stops the resizer picking them as
# generic fanout buffers, and it did, burning several ns per stage in the worst
# paths -- see TRIAL_NOTES.md "Session 2.1". Excluding them is a permanent win,
# independent of die size.
#
# Named DONT_USE_CELLS until LibreLane deprecated that spelling; it always
# resolved to EXTRA_EXCLUDED_CELLS internally, so this is a rename, not a
# behaviour change.
EXTRA_EXCLUDED_CELLS:
  - gf180mcu_fd_sc_mcu7t5v0__dlyb_1
  - gf180mcu_fd_sc_mcu7t5v0__dlyb_2
  - gf180mcu_fd_sc_mcu7t5v0__dlyb_4

# Fix antenna violations after DRT
DRT_ANTENNA_REPAIR_ITERS: 10
DRT_ANTENNA_REPAIR_MARGIN: 10 # %
PL_MAX_DISPLACEMENT_X: 800
PL_MAX_DISPLACEMENT_Y: 500

# ---------------------------------------------------------------------------
# PDN
#
# Layer choices carried over unchanged from config.yaml so the dry run stays
# comparable to the signoff baseline. Note that their original justification
# was the SRAM macros obstructing Metal1-Metal3, which no longer applies here:
# with no macros, Metal3 may well route cleanly again. Backing
# PDN_HORIZONTAL_LAYER and RT_MAX_LAYER off Metal5 is worth a trial of its own,
# and would retire the unresolved Metal5-ownership question in TRIAL_NOTES.md.
# ---------------------------------------------------------------------------

PDN_MULTILAYER: true
PDN_ENABLE_RAILS: true
PDN_RAIL_LAYER:       Metal1    # gf180mcu std cells expose VDD/VSS on Metal1
PDN_VERTICAL_LAYER:   Metal4
# General mesh horizontal layer, off Metal3 to relieve routing congestion
# there (see dry_run_pdn_cfg.tcl). Metal5 is normally reserved for a
# hierarchical parent's core ring; using it for our own mesh is a real
# ownership question, not yet cleared -- see TRIAL_NOTES.md.
PDN_HORIZONTAL_LAYER: Metal5


# Straps
PDN_VWIDTH:    5         
PDN_HWIDTH:    5          
PDN_VPITCH:    180
PDN_HPITCH:    180
PDN_VSPACING:  85        # (180 - 2*5) / 2
PDN_HSPACING:  85        # (180 - 2*5) / 2
PDN_EXTEND_TO: boundary   

PDN_ENABLE_PINS:     true    # Metal4/Metal5 pins for the parent to grab
PDN_CORE_RING:       false   # hierarchical integration; coordinate Metal5 use with parent
PDN_HORIZONTAL_HALO: 10
PDN_VERTICAL_HALO:   10

# Same as pdn_cfg.tcl minus the sram_grid, which matches on a macro cell this
# design does not instantiate.
PDN_CFG: dir::dry_run_pdn_cfg.tcl

# ---------------------------------------------------------------------------
# Corners
#
# gf180mcu_fd_sc_mcu7t5v0 is characterized at 3v30 as well as 5v00 -- the
# "5v0" in the library name is the device flavour, not a mandatory rail.
# Kept at 3.3V to match config.yaml, where the SRAM (3.3V only) sets the rail.
# ---------------------------------------------------------------------------
DEFAULT_CORNER: nom_tt_025C_3v30
STA_CORNERS:
  - nom_tt_025C_3v30
  - min_ff_n40C_3v60
  - max_ss_125C_3v00

LIB:
  "*_tt_025C_3v30":
    - /foss/pdks/gf180mcuD/libs.ref/gf180mcu_fd_sc_mcu7t5v0/lib/gf180mcu_fd_sc_mcu7t5v0__tt_025C_3v30.lib
  "*_ss_125C_3v00":
    - /foss/pdks/gf180mcuD/libs.ref/gf180mcu_fd_sc_mcu7t5v0/lib/gf180mcu_fd_sc_mcu7t5v0__ss_125C_3v00.lib
  "*_ff_n40C_3v60":
    - /foss/pdks/gf180mcuD/libs.ref/gf180mcu_fd_sc_mcu7t5v0/lib/gf180mcu_fd_sc_mcu7t5v0__ff_n40C_3v60.lib

# Due to OpenROAD bug
# https://github.com/The-OpenROAD-Project/OpenROAD/issues/8229
#PL_TIME_DRIVEN: False
#PL_ROUTABILITY_DRIVEN: False

# Do not error on magic DRC violations
# Note: Passing magic DRC is not required for the submission.
# However, it is recommended to fix or carefully review all violations.
ERROR_ON_MAGIC_DRC: False

# Prevent false positive DRC errors in I/O cells
MAGIC_GDS_FLATGLOB:
# For contacts
- "*_CDNS_*"
# Foundry provided SRAMs
- "*$$*"
- "M1_N*"
- "M1_P*"
- "M2_M1*"
- "M3_M2*"
- "nmos_5p0*"
- "nmos_1p2*"
- "pmos_5p0*"
- "pmos_1p2*"
- "via1_*"
- "ypass_gate*"
- "G_ring_*"
# These additional cells must be flattened to get rid of 3.3V devices
# (DUALGATE drawn into high-level cells)
- "dcap_103*"
- "din_*"
- "mux821_*"
- "rdummy_*"
- "pmoscap_*"
- "xdec_*"
- "ypredec*"
- "xpredec*"
- "prexdec_*"
- "xdec8_*"
- "xdec16_*"
- "xdec32_*"
- "sa_*"

# Since we cannot meet the minimum density limit on Metal2,
# ignore active metal on previous and subsequent layers
# (DM.5_DM.7 and DM.4_DM.6). Dummy metal is moved to active
# metal during the precheck.
KLAYOUT_FILLER_OPTIONS:
  Metal2_ignore_active: true

# Because we have multiple power pads for one power domain
MAGIC_EXT_UNIQUE: notopports

# No macros in the dry run. The gf180mcu_ocd_ip_sram block that config.yaml
# places here (four sram1024x8m8wm1 instances in a row along the bottom of the
# die) is deliberately absent -- ahb_ram.sv builds counters under DRY_RUN
# instead, so there is nothing to place, no macro PDN tap to make and no macro
# halo to cut rows around. Restore the block from config.yaml when the
# hardened RAM lands; it also carries the placement recipe.
MACROS: {}
PDN_MACRO_CONNECTIONS: []
