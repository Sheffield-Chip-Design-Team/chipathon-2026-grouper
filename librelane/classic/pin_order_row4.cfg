# Pin order for the LANDSCAPE 1650x1100 floorplan (row of 4 SRAMs along the
# bottom). The portrait 2x2 floorplan uses pin_order.cfg instead -- that one
# keeps the east edge clear because the SRAM column lives there. Here the macro
# row is at the bottom, so all four edges are available.
#
# Edge assignment is the landscape branch's pin_order_row4.cfg, which measured
# route DRC 0 / Magic DRC 0 on job 4340. The PATTERNS are this repo's, not that
# branch's: grouper_soc_chip_core's pad-facing ports are flat scalars -- one net
# per pad line, named <function>_<pad kind>_<signal> -- so these match
# `gpio_0_bidir_in`, not `bidir_in[0]`. The signal is the suffix, so a pattern
# per signal group needs no index at all. Bussed patterns like `bidir_in\[\d+\]`
# match nothing here and silently leave the group unplaced.
#
# uart_rx / uart_tx are plain signals rather than pad interfaces (chip_top maps
# them onto pads). uart_rx sits west with the other inputs, uart_tx south with
# the other outputs -- the same split the landscape branch used for its
# input_in / bidir_out groups.
#
# @bus_major is kept only so a future bussed port would still group sensibly;
# with no buses left it has nothing to order.
@bus_major

#N
clk
rst_n
.*_bidir_in

#E
.*_bidir_out
.*_bidir_oe

#S
uart_tx
.*_bidir_ie
.*_bidir_cs

#W
uart_rx
.*_bidir_sl
.*_bidir_pu
.*_bidir_pd
