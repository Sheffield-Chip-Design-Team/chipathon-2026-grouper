# grouper_soc_chip_core's pad-facing ports are flat scalars - one net per pad
# line, named <function>_<pad kind>_<signal> - so these patterns match
# `gpio_0_bidir_in`, not `bidir_in[0]`. The signal is the suffix, so a pattern
# per signal group needs no index at all.
#
# uart_rx / uart_tx are plain signals rather than pad interfaces (chip_top maps
# them onto pads), so they are placed by name alongside clk and rst_n.
# @bus_major is kept only so a future bussed port would still group sensibly;
# with no buses left it has nothing to order.
@bus_major

#N
.*_bidir_in
.*_bidir_oe
.*_bidir_ie

#S
uart_tx
.*_bidir_out

#W
clk
rst_n
uart_rx
.*_bidir_cs
.*_bidir_sl
.*_bidir_pu
.*_bidir_pd
