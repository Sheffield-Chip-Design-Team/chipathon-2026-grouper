#---------------------------------------------------------------------------
# Elaboration + Synthesis
#---------------------------------------------------------------------------

# Enable plugin for better SystemVerilog support
USE_SLANG: true
SLANG_ARGUMENTS: ['--keep-hierarchy']
SYNTH_HIERARCHY_MODE: deferred_flatten
# OFF because ON makes Magic streamout die with "stack smashing" on this RTL's
# deep hierarchy, in BOTH flatten and deferred_flatten
SYNTH_AUTONAME: false

SYNTH_STRATEGY: "AREA 3"
SYNTH_SIZING: true
SYNTH_ABC_DFF: true
# SYNTH_ABC_USE_MFS3: true # - this breaks picorv32 synth - leave it disabled

# ---------------------------------------------------------------------------
# Floorplan: 1675 x 1100 (landscape).
#
# Ported wholesale from the landscape branch's
# config_1650x1100_keepdlyc_fanout32.yaml -- job 4340, the only variant measured
# with BOTH route DRC 0 and Magic DRC 0. Every number in this section, the
# MACROS block and the PDN section below came across together; they are one
# unit and were signed off as one. Do not re-derive them individually.
#
# What job 4340 measured (2026-08-13, on that branch's RTL):
#   route DRC 0 | Magic DRC 0 | setup TNS 0, WNS +12.077ns (nom_tt), +33.233
#   (min_ff) | hold TNS 0, WNS +0.289ns (min_ff) | power grid 0 violations,
#   worst IR drop 1.78mV | 10 antenna nets, 97 diodes | 1,341,347um wirelength
#   | utilisation 0.690 | 8:01 on 8 CPUs
#
# This replaces the 1100x1500 portrait floorplan (2x2 macro block, 1.650mm^2).
# The trade, from the landscape branch's own head-to-head against portrait
# 1330x1370 on the identical recipe:
#
#   die         1.815mm^2 vs 1.822mm^2 portrait -- but +10% on the 1.650mm^2
#               this config used to be. That area is the price of the reshape.
#   setup WNS   +13.35 landscape vs +18.86 portrait
#   wirelength  1,306,990 vs 1,146,800 (+14%)
#   antennas    9 vs 6
#   Magic DRC   0 vs 2 (Metal3 spacing at the die edge, x 0.0-0.84, which
#               persists in EVERY portrait variant and is absent here)
#
# The row of 4 is what makes the reshape cheap: it needs 4*301.3 + 3*20 =
# 1265.2um, and landscape gives a 1636.32um core. Portrait at 1100 wide gives
# 1086.56um and forces the 2x2 rebuild with its inter-column channel.
#
# Core margins are 6.72um in x and 15.68um in y, measured from job 4315's
# floorplan DEF ("ROW ROW_0 ... 13440 31360 N DO 2351 ... STEP 1120", 2000
# DBU/um), not assumed:
#
#   core        x    6.72 .. 1643.04   (2922 sites)
#   core        y   15.68 .. 1081.92   (272 rows)
#
# config.yaml puts the macro band at y 190.00 .. 725.81 (macros at y=200,
# +/- the 10um halo), leaving three placeable regions:
#
#   below macros  1636.3 x 174.2  = 285,200um^2   (44 rows, full width)
#   above macros  1636.3 x 356.1  = 582,700um^2   (90 rows, full width)
#   east of them   345.4 x 535.8  = 185,100um^2
#                                 ---------------
#                                  1,053,000um^2 gross
#
# THIS FILE centres the same row (y 281.20 .. 817.01 with the halo,
# x 177.60 .. 1462.80), leaving four regions that form one connected ring:
#
#   below macros  1636.3 x 265.5  = 434,400um^2   (67 rows, full width)
#   above macros  1636.3 x 264.9  = 433,400um^2   (67 rows, full width)
#   west of them   170.9 x 535.8  =  91,600um^2   (305 sites)
#   east of them   180.2 x 535.8  =  96,600um^2   (321 sites)
#                                 ---------------
#                                  1,056,000um^2 gross
#
# The superseded NE-corner variant left two regions totalling 1,059,700um^2
# (south band 872,500 + west strip 187,200) but no row on the north or east
# edge at all. Gross placeable area is within 0.3% across all three, so
# PL_TARGET_DENSITY_PCT below still holds and the comparison isolates topology,
# not capacity -- which is the point: capacity was never what failed.
#----------------------------------------------------------------------------

FP_SIZING: absolute
DIE_AREA: [0.0, 0.0, 1675, 1110]

# RAM Macro Placement
MACROS:
  gf180mcu_ocd_ip_sram__sram1024x8m8wm1:
    gds:
      - dir::../../ip/gf180mcu_ocd_ip_sram/cells/gf180mcu_ocd_ip_sram__sram1024x8m8wm1/gf180mcu_ocd_ip_sram__sram1024x8m8wm1.gds
    lef:
      - dir::../../ip/gf180mcu_ocd_ip_sram/cells/gf180mcu_ocd_ip_sram__sram1024x8m8wm1/gf180mcu_ocd_ip_sram__sram1024x8m8wm1.lef
    vh:
      - dir::../../ip/gf180mcu_ocd_ip_sram/cells/gf180mcu_ocd_ip_sram__sram1024x8m8wm1/gf180mcu_ocd_ip_sram__sram1024x8m8wm1__blackbox_pp.v
    instances:
      # SIZE 301.300 BY 515.810 ; native (unrotated) footprint: 301.3(X) x 515.81(Y).
      #
      # ===== CENTRED PLACEMENT (this file's ONLY delta vs config.yaml) =====
      #
      # Same row of 4, same 321.3um stride, same orientation S as config.yaml.
      # The whole row is translated to the CENTRE of the core, so that the
      # placeable sites form a closed RING around the macro band and every die
      # edge keeps a band of rows for its I/O port buffers.
      #
      # WHY THIS SUPERSEDES THE NE-CORNER PLACEMENT
      #   The NE placement (x 367.92/689.22/1010.52/1331.82, y 558.88) mirrored
      #   the Grouper<->Trouper integration floorplan -- macros hard against the
      #   NE corner of Grouper's lobe of the 2235x2235 die. Derivation retained
      #   at the bottom of this comment. It left 7.23um above the row and 9.92um
      #   east of it, both smaller than the 10um halo, so cut_rows generated NO
      #   row in either sliver:
      #
      #     y <= 544.88   rows x   6.72 .. 1643.04   (full width)
      #     y >= 548.80   rows x   6.72 ..  357.84   (west column only)
      #     max row y = 1078.00, still capped at x <= 357.84
      #
      #   Every north-edge pin outside x < 358 therefore had no legal site for
      #   the port buffer Repair Design inserts at it, and detailed placement
      #   could not reach one within PL_MAX_DISPLACEMENT_X. Both NE runs died at
      #   stage 30/78 on DPL-0036, and the failing instances tracked the north
      #   edge exactly -- change the pin order, change which ports fail:
      #
      #     job 5139  N = clk, rst_n, .*_bidir_in   -> input12 .. input16
      #     job 5140  N = .*_bidir_pu, .*_bidir_pd  -> output65 .. output128
      #
      #   Note the blocked edges were NORTH and EAST. The west column is the one
      #   region the NE placement left intact at every y; it was never the
      #   constraint. Pin order cannot fix a missing row, which is why 5140
      #   reproduced 5139's failure with a different port list.
      #
      # DERIVATION OF THE CENTRED COORDINATES
      #   core        x    6.72 .. 1643.04   (2922 sites, 1636.32um)
      #   core        y   15.68 .. 1081.92   (272 rows,   1066.24um)
      #   row bbox                1265.2 x 515.81   (4*301.3 + 3*20)
      #   with the 10um halo      1285.2 x 535.81
      #
      #   Centred:  x0 = 6.72 + (1636.32 - 1285.2)/2 + 10 = 192.28
      #             y0 = 15.68 + (1066.24 - 535.81)/2 + 10 = 290.90
      #
      #   Both are then snapped, NOT to the nearest site, but to the phases that
      #   cost the PDN nothing (see PDN note below):
      #
      #     x  187.60  508.90  830.20  1151.50    (= NE placement - 180.32)
      #     y  291.20                             (= NE placement - 267.68)
      #
      #     180.32 = 322 x 0.56 = exactly one PDN_VPITCH.
      #     267.68 = 478 x 0.56.
      #   Both are 0.56um multiples, so every macro keeps config.yaml's site-grid
      #   phase, same as the NE placement did.
      #
      #     row bbox  x 187.60..1452.80   y 291.20..807.01
      #     margins   west  170.88  (305 sites)     east  180.24  (321 sites)
      #               south 265.52  ( 67 rows)      north 264.91  ( 67 rows)
      #
      #   All four are comfortably larger than the 10um halo, so cut_rows emits
      #   real rows on all four edges and no pin is stranded whatever the pin
      #   order does.
      #
      #     x      6.7        187.6   508.9   830.2   1151.5  1452.8   1643.0
      #  1081.9   +----------------------------------------------------+ core
      #           |            north band 1636.3 x 264.9               |
      #   807.0   |         +-------++-------++-------++-------+       |
      #           |  west   | sram0 || sram1 || sram2 || sram3 | east  |
      #           | 170.9 x +-------++-------++-------++-------+ 180.2 |
      #   291.2   |  535.8    (halo'd band 1285.2 x 535.81)     x 535.8|
      #           |            south band 1636.3 x 265.5               |
      #    15.7   +----------------------------------------------------+
      #
      #   Placeable area 434.4k + 433.4k + 91.6k + 96.6k = ~1,056,000um^2,
      #   against ~1,053,000um^2 for config.yaml's three-region split and
      #   ~1,060,000um^2 for the NE two-region split. Within 0.3% of both, so
      #   PL_TARGET_DENSITY_PCT below still holds and this stays a topology
      #   experiment, not a capacity one. What changes is that the placeable
      #   area is now ONE connected ring rather than an L or a band-plus-strip.
      #
      # PDN IS UNTOUCHED -- pdn_cfg.tcl and every PDN_* value are identical to
      # config.yaml, and the x translation was chosen to make that free rather
      # than merely legal. Shifting by exactly one PDN_VPITCH (180.32 = two half
      # periods of the 22.96 + n*90.16 Metal4 lattice, and 2 is even) leaves
      # every macro seeing a bit-identical stripe phase AND net assignment to
      # the NE placement:
      #
      #     stripes crossing each macro   4 / 3 / 4 / 3   (NE: 4 / 3 / 4 / 3)
      #
      #   Jobs 5139 and 5140 both cleared *-checker-powergridviolations at that
      #   phase with 0 violations on both nets before dying later in the flow,
      #   so the lattice is measured, not argued. Per constraint 3 in the Straps
      #   section, macro x is free apart from the site grid anyway; this just
      #   removes the question.
      #
      #   The y translation moves the Metal3 rungs the macros trim. Rung centres
      #   are core_lly + 14.98 + n*149.52 = 30.66, 180.18, 329.70, 479.22,
      #   628.74, 778.26, 927.78, 1077.30. Against the macro M3 obstruction
      #   (y 294.20..804.01 here) four rungs are trimmed and four survive full
      #   width -- two below the band, two above it -- versus five surviving but
      #   four of them bunched below the band on the NE placement. The trimmed
      #   rungs still run 6.72..190.60 and 1449.80..1643.04, i.e. across the
      #   whole of the west and east strips, so the Metal2-Metal4 bridge reaches
      #   the cells in them. Still gate the run on
      #   design__power_grid_violation__count__net:VSS at
      #   *-checker-powergridviolations -- it fails fast and it is the check
      #   that catches a walked-off lattice.
      #
      # SUPERSEDED: NE-CORNER DERIVATION (kept for the integration mapping)
      #   SOURCE
      #     ../../../lora-mimo/lora-mimo/integration/pd/config_landscape_2235.yaml
      #       DIE_AREA          [0, 0, 2235, 2235]
      #       FP_OBSTRUCTIONS   A [0, 0, 1117.5, 1117.5]   (Trouper-side keepout)
      #                         B [1665, 1117.5, 2235, 2235]
      #       macros            y = 1695.67, x = 388.65 / 709.95 / 1031.25 / 1352.55
      #                         orientation S, stride 321.3  (identical geometry)
      #   Grouper's lobe there is x 0..1665, y 1117.5..2235 = 1665 x 1117.5,
      #   within 1% of this die's 1650 x 1100; anchoring the same NE corner gave
      #   x 367.92/689.22/1010.52/1331.82, y 558.88, with margins east 9.92 and
      #   north 7.23. Those two slivers are the DPL-0036 cause above. If the
      #   integration floorplan really does require the NE corner, the fix is on
      #   the integration side -- pull obstruction B's edge and the lobe's north
      #   boundary in far enough to leave a halo-plus-rows band (>= ~40um) north
      #   and east of the row -- not a pin-order change on this side.
      #
      # Instance names are the full flattened path from grouper_soc_chip_core;
      # see config.yaml for the hierarchy walk and the netlist grep that
      # confirms them.
      "u_grouper_soc_top.u_grouper_soc_dig_ss.u_ram_ss.gen_macro_ram.gen_sram[0].u_wrapper.u_sram_macro":
        location: [187.60, 291.20]
        orientation: S
      "u_grouper_soc_top.u_grouper_soc_dig_ss.u_ram_ss.gen_macro_ram.gen_sram[1].u_wrapper.u_sram_macro":
        location: [508.90, 291.20]
        orientation: S
      "u_grouper_soc_top.u_grouper_soc_dig_ss.u_ram_ss.gen_macro_ram.gen_sram[2].u_wrapper.u_sram_macro":
        location: [830.20, 291.20]
        orientation: S
      "u_grouper_soc_top.u_grouper_soc_dig_ss.u_ram_ss.gen_macro_ram.gen_sram[3].u_wrapper.u_sram_macro":
        location: [1151.50, 291.20]
        orientation: S

    # One Liberty per corner, matching the STA_CORNERS names 
    lib:
      "*_tt_025C_3v30":
        - dir::../../ip/gf180mcu_ocd_ip_sram/cells/gf180mcu_ocd_ip_sram__sram1024x8m8wm1/gf180mcu_ocd_ip_sram__sram1024x8m8wm1__tt_025C_3v30.lib
      "*_ss_125C_3v00":
        - dir::../../ip/gf180mcu_ocd_ip_sram/cells/gf180mcu_ocd_ip_sram__sram1024x8m8wm1/gf180mcu_ocd_ip_sram__sram1024x8m8wm1__ss_125C_3v00.lib
      "*_ff_n40C_3v60":
        - dir::../../ip/gf180mcu_ocd_ip_sram/cells/gf180mcu_ocd_ip_sram__sram1024x8m8wm1/gf180mcu_ocd_ip_sram__sram1024x8m8wm1__ff_n40C_3v60.lib

# This is an alternative method compared to
# specifying the power connections in the RTL
PDN_MACRO_CONNECTIONS:
- ".*u_sram_macro VDD VSS VDD VSS"

# Halo size around macros while cutting rows.
# Workaround for: https://github.com/The-OpenROAD-Project/OpenROAD/issues/8868
FP_MACRO_HORIZONTAL_HALO: 10   # 20um macro gap => 10 is the max; 36 overlaps
                               # neighbouring halos and fails DPL-0011 (job 4284)
FP_MACRO_VERTICAL_HALO: 10

# ---------------------------------------------------------------------------
# NO FP_OBSTRUCTIONS on this floorplan.
#
# The portrait 2x2 block needed a keep-out over its 58.22um inter-column
# channel: after the halos those rows were 38.22um long, walled by SRAM on both
# sides, and detailed placement could not shuffle a cell out of them when
# antenna repair dropped a diode next to a pin (DPL-0036, and the failing
# instances were repair buffers). The row of 4 has no such channel -- the 20um
# gaps are fully consumed by the halos, so no rows are generated between the
# macros at all.
#
# Do not add one back "for safety": any blockage sharing the macro band trips
# DPL-0010/0011 on the macros themselves (jobs 4283, 4289).

# I/O pins: RE-TUNED for this floorplan (pin_order_int_ram.cfg), because
# carrying pin_order_row4.cfg over unchanged does not run -- job 5139 proved
# it. That is a second variable, and it is a deliberate one; the reasoning:
#
#   Job 5139 was this file with IO_PIN_ORDER_CFG still dir::pin_order_row4.cfg,
#   i.e. a true single-variable A/B against config.yaml. It died at stage 30
#   (OpenROAD.RepairDesignPostGPL) in 150s:
#
#     [INFO  DPL-0034] Detailed placement failed on the following 5 instances:
#     [INFO  DPL-0035]  input12 .. input16
#     [ERROR DPL-0036] Detailed placement failed.
#
#   input0..input17 are the 18 buf_1 cells RSZ-0027 inserts on the 18 input
#   ports (rst_n, uart_rx, and gpio_*_bidir_in x16 -- clk is not buffered).
#   An input buffer is placed AT its pin, so it needs a legal site next to
#   that pin. pin_order_row4.cfg puts every one of those 18 ports on the NORTH
#   edge, and on this floorplan the north edge has no sites behind it: the
#   macro row's top is 1074.69 and its 10um halo reaches 1084.69, past
#   core_ury 1081.92, so CutRows generates ZERO rows above the macros. Only
#   x < 357.84 (the west strip) is served, i.e. 22% of the edge. Confirmed in
#   job 5139's own 16-openroad-cutrows DEF: 272 rows, and every row in
#   y 548.88..1084.69 is 627 sites starting at x=6.72 -- the west strip and
#   nothing else.
#
#   This is NOT a capacity problem, which is why padding/density knobs are not
#   the answer. Job 5139 had 482,664 placeable sites (1,059,543um^2) against
#   the baseline's 477,936 (1,049,165um^2) -- 1% MORE room -- and it has no
#   stranded slivers at all, where the baseline carries a 10-site sliver on
#   138 of its rows. It is purely a locality problem at the north edge.
#
#   The fix is to stop putting inputs on the walled edge. Which edges have
#   rows behind them here:
#     W  full height        (west strip above y=548.88, full-width band below)
#     S  full width         (the 137-row bottom band)
#     E  y < 548.88 only    (the macro's east halo reaches core_urx above that)
#     N  x < 357.84 only    (the west strip)
#   So all 18 inputs go to W, and the 113 output ports spread over N/E/S.
#   Output buffers are placed near their internal DRIVER rather than at the
#   pin, which is why job 5139's 32 E-edge output pins survived an east edge
#   that is walled above y=548.88 while the N-edge inputs did not.
#
# The honest reading of the pair: config.yaml's placement works with the
# shipping pinout and this one does not, so any comparison of the two must
# say which pinout it assumed.
#
# N AND S PINS LAND ON METAL2, AND METAL2 CARRIES PDN STRAPS. This has now bitten
# twice, on both horizontal edges, and the fix is in pdn_cfg.tcl rather than here.
#
#   Portrait, north edge: bidir_out escapes shorted to the VSS straps at the
#     stripe right edges (x=323.82 and x=1042.86, each a stripe origin +
#     PDN_VWIDTH). TRIAL_NOTES.md Session 5.4; worked around by moving the group.
#
#   Landscape, south edge (job 4850): the PIN SHAPES themselves overlapped the
#     Metal2 VDD straps -- gpio_15_bidir_ie, gpio_10_bidir_cs, gpio_6_bidir_cs --
#     for 7 LVS errors, with route DRC still 0 because a fixed pin terminal is
#     not something DRT places.
#
# Both are the same defect: PDN_EXTEND_TO boundary ran the Metal2 intermediate
# straps out through the 15.68um I/O band, where the pins live. Those straps now
# stop at the core (pdn_cfg.tcl -- see the long note on the Metal2 add_pdn_stripe
# for why Metal2 in particular loses nothing by it), so the edge assignment below
# is free again and moving a group is NOT the fix if this reappears.
#
# PDN_EXTEND_TO below stays `boundary`: Metal4 and Metal5 still need it, since
# PDN_ENABLE_PINS hands the parent its power on exactly those two layers.
#
# THE .cfg FILE MUST CARRY NO COMMENTS. Odb.CustomIOPlacement has no comment
# syntax: '#' introduces a direction marker (#N/#E/#S/#W) and nothing else, so
# a prose line reduces to the token '#' and the step dies with
#   identifier/regex '#' requires a direction to be set first
# (run RUN_2026-08-23_05-01-39, stage 24). That is why the explanation lives
# here in the YAML instead of next to the patterns.
#
# Edge assignment in pin_order_row4.cfg:
#   N  clk, rst_n, *_bidir_in          E  *_bidir_out, *_bidir_oe
#   S  uart_tx, *_bidir_ie, *_bidir_cs W  uart_rx, *_bidir_sl/_pu/_pd
#
# The PATTERNS are this repo's, not the landscape branch's. chip_core's
# pad-facing ports are flat scalars -- one net per pad line, named
# <function>_<pad kind>_<signal> -- so `.*_bidir_in` matches `gpio_0_bidir_in`.
# Bussed patterns like `bidir_in\[\d+\]` match nothing here and would silently
# leave every group unplaced. uart_rx/uart_tx are plain signals rather than pad
# interfaces (chip_top maps them onto pads), so they sit with the inputs and
# outputs respectively.
# IO_PIN_ORDER_CFG: dir::pin_order_row4.cfg   # the config.yaml assignment; see
#                                            # pin_order_int_ram.cfg's rationale
IO_PIN_ORDER_CFG: dir::pin_order.cfg

#---------------------------------------------------------------------------
# Constraints
#---------------------------------------------------------------------------

# SDC files
PNR_SDC_FILE:     dir::grouper_chip_core.sdc
SIGNOFF_SDC_FILE: dir::grouper_chip_core.sdc
FALLBACK_SDC:     dir::grouper_chip_core.sdc

# ---------------------------------------------------------------------------
# PDN
# ---------------------------------------------------------------------------

# The SRAM obstructs Metal1/Metal2/Metal3 across its whole interior and exposes
# VDD/VSS only on a ~3um Metal3 perimeter frame. Metal4 is unobstructed, so it
# is the only layer that can carry power over the macros.

# Power / ground nets
VDD_NETS:
  - VDD
GND_NETS:
  - VSS

PDN_MULTILAYER:       true
PDN_ENABLE_RAILS:     true
PDN_RAIL_LAYER:       Metal1    # gf180mcu std cells expose VDD/VSS on Metal1
PDN_VERTICAL_LAYER:   Metal4    # carries over the SRAMs
PDN_HORIZONTAL_LAYER: Metal5

# ---------------------------------------------------------------------------
# Straps
#
# Four constraints set these numbers, listed below in the order they were
# discovered rather than numerically.
#
# 1. ROUTING-GRID ALIGNMENT (this is the DRC one). Every width, pitch and
#    spacing is a whole number of routing tracks: 0.56um on Metal2/3/4,
#    0.90um on Metal5 (DEF: "TRACKS X 560 DO 1964 STEP 1120 LAYER Metal2" at
#    2000 DBU/um). The old 180um pitch was 321.43 Metal2 tracks, so
#    consecutive stripe columns drifted 0.4um out of phase with the routing
#    grid and two of them landed 0.08um short of Metal2 minimum spacing
#    (0.28um) to the nearest usable track -- permanently DRC-illegal, which is
#    what made detailed routing plateau instead of converge (four "Metal
#    Spacing" violations against VDD/VSS on Metal2, both at a stripe edge).
#    See TRIAL_NOTES.md.
#
# 2. STRIPE PHASE. pdngen treats PDN_VOFFSET as the offset from the core's
#    lower-left to the *centre* of the first stripe, and cuts the stripe at
#    centre +/- width/2 (OpenROAD src/pdn/src/straps.cpp, Straps::makeStraps).
#    So a stripe's left edge is core_llx + PDN_VOFFSET - PDN_VWIDTH/2 =
#    6.72 + 16.24 - 2.52 = 20.44, and because the pitch is a whole number of
#    tracks every stripe shares that edge phase.
#
#    Metal2 tracks are at 0.28 + n*0.56 (DEF: "TRACKS X 560 ... STEP 1120"), so
#    what matters is the edge's offset from a track centre. A wire on a track
#    needs 0.28um (Metal2 minimum spacing) edge-to-edge, i.e. its centre must be
#    >= 0.42um from the stripe edge. 20.44 - 0.28 = 20.16 = 36 x 0.56 exactly:
#    a track centre lands ON the stripe edge. That track is unusable (a wire on
#    it would overlap the stripe), but the next one out is a full 0.56um away,
#    so nothing is DRC-illegal -- it costs one track per stripe edge.
#
#    The portrait offset 4.34 put the edge at residue 0.42 from the nearest
#    track, which wastes nothing. 16.24 is kept anyway because it is what job
#    4340 measured clean at; do not "improve" it to reclaim two tracks without
#    a run. The value to avoid is residue 0.28 (e.g. offset 10.92), where BOTH
#    neighbouring tracks sit 0.14um from the stripe edge and are illegal to
#    route on -- that is the defect constraint 1 describes.
#
# 4. FITTING THE LAST STRAP. Straps run while centre + PDN_VWIDTH/2 <= core_urx.
#    Here the lattice is 22.96 + n*90.16 (VDD/VSS alternate every half period)
#    against core_urx 1643.04, so it stops at n=17 (1555.68): 18 stripes, 13.72um
#    of core west of the first and 84.84um east of the last.
#
#    THAT EASTERN GAP IS THE THING TO CHECK ON THE FIRST RUN. On portrait, a
#    50.42um gap in the same position made pdngen improvise a VDD strap whose
#    Metal2 and Metal4 halves were 0.56um apart instead of coincident, and that
#    cost 17 unroutable Metal2 spacing violations (TRIAL_NOTES.md Session 5.7).
#    Job 4340 reported a clean power grid with this exact lattice, so it is
#    probably fine here -- but dump the vertical straps and confirm a clean
#    18-entry alternating ladder with nothing off-lattice before trusting it.
#
#    IF an improvised strap does appear, the fix is the portrait one: shift the
#    lattice west to fit a 19th. PDN_VOFFSET 10.64 is the nearest legal phase
#    that does it -- first centre 17.36, last 1640.24, 19 stripes, 8.12um west
#    margin and 0.28um east. Tight, untested, and a deviation from the measured
#    config, so only reach for it if the ladder is actually dirty.
#
# 3. SRAM TAPPING. gf180mcu_ocd_ip_sram__sram1024x8m8wm1 obstructs
#    Metal1-Metal3 over its interior (LEF OBS: 3.0 3.0 .. 298.3 512.81), so the
#    Metal4 straps are the SRAM's only power path. Outside that box it exposes
#    239 VDD and 195 VSS Metal3 tabs distributed around the WHOLE perimeter --
#    x 0..301.3, y 0..515.81 -- not just two vertical edge bands.
#
#    AN EARLIER VERSION OF THIS COMMENT WAS WRONG, and it is worth spelling out
#    because it locked four coordinates that did not need locking. It claimed
#    the frame carried both nets only on two bands 298.3um apart, and derived
#    PDN_VPITCH 119.84 from needing a half-period that divides 298.3 an odd
#    number of times (298.3/5 = 59.66 -> 59.92). Read against the LEF that
#    reasoning does not hold: because the tabs are dense and all round the
#    frame, ANY on-grid Metal4 lattice that crosses a macro taps both nets.
#    Measured on the landscape branch, all four macros pass check_power_grid at
#    four DIFFERENT strap phases (22.4, 163.4, 124.0, 84.7 mod a 180.32 pitch).
#    So macro x is free apart from the 0.56um site grid, and the macros are NOT
#    welded to PDN_VOFFSET. See TRIAL_NOTES.md, landscape branch Session 6.6.
#
#    The portrait 119.84 came out of that derivation. It is gone with the rest
#    of the portrait lattice; 180.32 below is the value job 4340 measured clean
#    with this macro row.
#
#    WHAT DOES STILL MATTER IS DRIFT ACROSS THE MACRO ROW, which is a grid
#    problem rather than a phase one, and it bites harder here than on portrait
#    because four macros sit in a line: at 179.2 the lattice walks -5.6um over
#    the 7 periods spanning the row, the straps step off the 3um-wide tabs, and
#    the power-grid checker reports 28,227 VSS violations; 180.32 drifts
#    +2.24um and holds. Always confirm
#    design__power_grid_violation__count__net:VSS at the
#    *-checker-powergridviolations step before trusting ANY pitch or macro-x
#    change -- it fails fast and it is the check that catches a walked-off
#    lattice. `check_power_grid -net VDD` / `-net VSS` is the interactive form.
#
# Metal5 (horizontal) never touches the macros, so PDN_HPITCH only has to obey
# constraint 1: 180 = 200 x 0.90, width 6 x 0.90, offset 18 x 0.90.
# ---------------------------------------------------------------------------
PDN_VWIDTH:   5.04    # 9 x 0.56
PDN_HWIDTH:   5.4     # 6 x 0.90
PDN_VPITCH:   180.32  # 322 x 0.56 AND 161 x 1.12, so BOTH the VDD and VSS stripe
                      # of each pair land on the grid. Drifts +2.24um across the
                      # macro row and holds -- see constraint 3.
PDN_HPITCH:   180     # 200 x 0.90
PDN_VSPACING: 85.12   # 180.32/2 - 5.04 = 152 x 0.56
PDN_HSPACING: 84.6    # (180 - 2*5.4)/2 = 94 x 0.90
PDN_VOFFSET:  16.24   # 29 x 0.56 (was 16.32 = 29.14, off-grid). Left edge 20.44
PDN_HOFFSET:  16.2    # 18 x 0.90 (was 16.65 = 18.5, off-grid)
PDN_EXTEND_TO: boundary   # Metal4/Metal5 only -- pdn_cfg.tcl withholds this from
                          # the Metal2 straps, which would otherwise cross the
                          # I/O band and short the N/S pins. See the I/O pins
                          # note above.

PDN_ENABLE_PINS:     true    # Metal3/Metal4 pins for the parent to grab
PDN_CORE_RING:       false   # hierarchical integration; coordinate Metal5 use with parent
PDN_HORIZONTAL_HALO: 10
PDN_VERTICAL_HALO:   10

PDN_CFG: dir::/pdn_cfg.tcl

# ---------------------------------------------------------------------------
# PLACEMENT
# ---------------------------------------------------------------------------

#   PL_TARGET_DENSITY_PCT   antenna violations   DPL-0036 instances
#   68                      117                  5
#   62                      157                  24
#
# More wire is more antenna area, which is more diodes to insert and legalise.
# The diode pressure scales with wirelength, so the density knob works against
# this failure rather than for it. Do not re-try lowering it without a reason
# that explains those two rows.
#
# Floor if it is ever lowered: GPL-0302 compares the target against
# utilisation WITH GPL_CELL_PADDING applied -- 425,581um^2 of cells in
# 974,111um^2 of free area is 43.7%, inflated to 52.6% by the 2 sites of
# padding -- so anything under ~56 errors out.

# Global placement keeps 2 sites of padding -- that spread is the proven
# congestion recipe and it costs nothing at legalisation time. Detailed
# placement is at 0: 1 cleared DPL-0034 at global placement but still failed
# post-CTS, and 0 is what got the flow through to detailed routing.
#
# Note the tension now that routing is the blocker: padding is a congestion
# lever (Session 2 used 2), so raising it would help DRT and hurt
# legalisation. If AREA 0 synthesis shrinks the design enough, 1 is worth
# retrying -- but only with the post-CTS step watched.
#
# The arithmetic, from the RUN_2026-08-12_00-39-24 metrics: macro row cutting
# leaves 649 rows / 341,814 sites = 750,350um^2 actually placeable (the
# reported design__instance__utilization__stdcell of 51.6% divides by
# core-minus-macros and so flatters it by 74,000um^2). 425,581um^2 of std
# cells is 56.7% of that. The average cell is 5.46um = 9.76 sites wide, so
# 2 sites of padding inflate it by ~20% to 68.3% -- level with
# PL_TARGET_DENSITY_PCT, in a region already fragmented into an L plus two
# narrow channels. 560 unlegalisable instances out of 19,873 is what that
# looks like. One site of padding puts it at 62.5%.

#   68->80: TRIED AND REVERTED (job 5333, run against config.yaml). Antenna
#   violations did drop as hypothesized (72 found -> 55 after jumpers, vs 117
#   at density 68), but legalization headroom lost more than antenna pressure
#   gained: DPL-0036 hit at u_gpio_ctrl._1301_ in the SE die corner, the same
#   corner region that also broke on pin_order.cfg changes, this time with
#   pin_order.cfg held byte-identical to the verified baseline. That corner
#   has essentially no legalization slack in this floorplan; any perturbation
#   to global placement -- density or pin order -- tips it. Back to 68, the
#   only value with a verified clean signoff (job 4851). Kept in lockstep
#   with config.yaml.
PL_TARGET_DENSITY_PCT: 68
MAX_FANOUT_CONSTRAINT: 32   # was 16. 232 nets exceed fanout 16, and the worst
                            # setup path in job 4315 WAS a fanout tree:
                            # u_grouper_soc_top.rst_n_sync has 996 loads and
                            # repair_design built ~5 buffer levels to serve it.
                            # log16(996)=2.5 levels minimum vs log32(996)=2.0, so
                            # relaxing this makes the tree shallower AND smaller.
                            # 114 nets still exceed 32, so this relaxes rather
                            # than removes the constraint. Second, independent
                            # lever on the same failure as DONT_USE_CELLS below.
GPL_CELL_PADDING: 2
DPL_CELL_PADDING: 0

# BAN THE DELAY CELLS THAT ARE ABUSED, KEEP THE ONE THAT DOES REAL WORK.
#
# The library has twelve delay cells: dlya/dlyb/dlyc/dlyd x _1/_2/_4 (confirmed
# against gf180mcu_fd_sc_mcu7t5v0__tt_025C_3v30.lib, job 4321). They are
# functionally buffers (Z = I), so OpenROAD's resizer treats them as buffer
# candidates -- but it uses them for two very different jobs, and only one of
# those is legitimate:
#
#   HOLD REPAIR (legitimate). Job 4315 used 67 dlyc_1 as hold buffers. Buying
#     delay per unit area is exactly what a delay cell is for. Banning these
#     forces hold repair onto clkbuf_1 chains: job 4322 needed 229 cells to do
#     what 68 did, and hold margin fell from 0.8966 -> 0.8004ns (nom_tt) and
#     0.3677 -> 0.3431ns (min_ff). Still passing, but 3.4x the cells and ~10%
#     less margin -- a bad trade to make on purpose, and a worse one once the
#     hardened SRAM's real hold requirements land.
#
#   MAX-FANOUT / MAX-SLEW REPAIR (abuse). Job 4315 also inserted 794 dlyd_1 as
#     fanout buffers, making it the most-used cell in the design -- more than
#     every real buffer combined. Fanout repair is a DRIVE STRENGTH problem and
#     a delay cell is the worst possible answer to it. Same path, same load,
#     from 4315's own signoff report:
#
#       load_slew822  buf_4   fanout 12  0.113pF  delay 0.667ns  slew 0.700ns
#       fanout828     dlyd_1  fanout 11  0.141pF  delay 5.151ns  slew 3.299ns
#
#     7.7x the delay, 4.7x the output slew. Seven of them contributed ~35ns to
#     the worst path while the real logic (nand3 -> nor4 -> or2) contributed
#     2.6ns. That was the whole of the setup failure: WNS -4.42ns, TNS
#     -38.17ns over 35 reg-to-reg endpoints. Banning the family took the same
#     floorplan to WNS +18.76ns and TNS 0 (job 4322).
#
# So: ban dlya/dlyb/dlyd, keep dlyc_* for hold repair. This supersedes the
# earlier dlyb-only ban, which was made on congestion grounds and missed dlyd
# entirely -- see TRIAL_NOTES.md Session 2.1 for the original finding and the
# landscape branch's Session 6.1-6.3 for the full one.
#
# WATCH FOR MIGRATION. The resizer chose dlyd for fanout and dlyc for hold, so
# they are not interchangeable in its cost model -- but if a future run shows
# dlyc_* instance counts in the hundreds rather than the ~70 hold repair needs,
# fanout repair has migrated onto it and the full twelve-cell ban is the
# fallback. Check with:
#   grep -oE "gf180mcu_fd_sc_mcu7t5v0__dly[a-z]_[0-9]+" <run>/*detailedrouting/*.def | sort | uniq -c
DONT_USE_CELLS:
  - gf180mcu_fd_sc_mcu7t5v0__dlya_1
  - gf180mcu_fd_sc_mcu7t5v0__dlya_2
  - gf180mcu_fd_sc_mcu7t5v0__dlya_4
  - gf180mcu_fd_sc_mcu7t5v0__dlyb_1
  - gf180mcu_fd_sc_mcu7t5v0__dlyb_2
  - gf180mcu_fd_sc_mcu7t5v0__dlyb_4
  - gf180mcu_fd_sc_mcu7t5v0__dlyd_1
  - gf180mcu_fd_sc_mcu7t5v0__dlyd_2
  - gf180mcu_fd_sc_mcu7t5v0__dlyd_4

# ---------------------------------------------------------------------------
# CTS
# ---------------------------------------------------------------------------

# Clock -- direct port on this macro, no I/O pad in this flow
CLOCK_PORT: clk
CLOCK_PERIOD: 62.5 # 16MHz

CTS_OBSTRUCTION_AWARE: true
CTS_DELAY_BUFFER_DERATE_PCT: 100
CTS_BALANCE_LEVELS: true
CTS_CLK_MAX_WIRE_LENGTH: 0
CTS_DISTANCE_BETWEEN_BUFFERS: 0
CTS_SINK_CLUSTERING_SIZE: 20
CTS_SINK_CLUSTERING_MAX_DIAMETER: 60
CTS_APPLY_NDR: none

CTS_CLK_BUFFERS:
  - "gf180mcu_fd_sc_mcu7t5v0__clkbuf_4"
  - "gf180mcu_fd_sc_mcu7t5v0__clkbuf_8"
  - "gf180mcu_fd_sc_mcu7t5v0__clkbuf_12"
  - "gf180mcu_fd_sc_mcu7t5v0__clkbuf_16"

PL_RESIZER_HOLD_SLACK_MARGIN: 0.3
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.25

# Pre-routing setup repair (fixes timing before route guides exist, unlike
# the RUN_POST_GRT_* flags which are gated off by default and hung on this
# design's tighter density -- see TRIAL_NOTES.md). Modeled on the adjacent
# trouper repo's RUN_POST_GPL_DESIGN_REPAIR / GRT_RESIZER_SETUP_MAX_BUFFER_PCT.
RUN_POST_GPL_DESIGN_REPAIR: true
RUN_POST_CTS_RESIZER_TIMING: true
PL_RESIZER_SETUP_MAX_BUFFER_PCT: 40

# REVERT THESE FIRST if timing signoff comes back worse: they trade repair
# aggressiveness for area, and the area is only needed while the design is
# this close to the legalisation limit.
DESIGN_REPAIR_MAX_SLEW_PCT: 10
DESIGN_REPAIR_MAX_CAP_PCT:  10

# Routing / ESD
DIODE_ON_PORTS: in

# ---------------------------------------------------------------------------
# Route
# ---------------------------------------------------------------------------

# GRT hands off to DRT instead of failing on congestion. Safe only because
# Checker.TrDRC is still live downstream (it is absent from
# meta.substituting_steps and has no ERROR_ON_* override), so a route that does
# not converge still hard-fails -- it just fails later, with a DRC report.
GRT_ALLOW_CONGESTION: true
GRT_ADJUSTMENT: 0.3   # 0.2 handed DRT a start it plateaued on at 91 violations
                      # (job 4285); reserve more global capacity so DRT begins
                      # cleaner. Travels with GRT_ALLOW_CONGESTION above.

# Cap the DRC opt loop so a plateauing route reaches a verdict instead of
# grinding to the flow default. Keep while iterating; raise for signoff.
DRC_OPT_ITERS: 12

# Moved to Metal5 to relieve Metal3 congestion at 1310x1150 (see TRIAL_NOTES.md).
RT_MAX_LAYER: Metal5

# 64 -> 32 and the Metal2 ROUTING_OBSTRUCTIONS below: kept in lockstep with
# config.yaml -- see the long-form rationale there (job 5336). Same
# PDN_VOFFSET/PDN_VPITCH/DIE_AREA as config.yaml (this file only moves the
# MACROS location: values), so the PDN Metal2 intermediate-stripe lattice is
# identical and these are the same real obstruction columns, not a guess
# carried over from a different geometry.
DRT_OPT_ITERS: 32

# List of lists, not flat strings -- see config.yaml (job 5337).
ROUTING_OBSTRUCTIONS:
  - ["Metal2", 290.92, 0, 295.96, 1110]
  - ["Metal2", 1463.00, 0, 1468.04, 1110]

PL_MAX_DISPLACEMENT_X: 800
PL_MAX_DISPLACEMENT_Y: 500

# Fix antenna violations after DRT
DRT_ANTENNA_REPAIR_ITERS: 0    # DRT's antenna reroute took a converged 4-violation
                               # route to 128 (job 4296, drt-run-0 vs drt-run-1).
                               # Antennas are already repaired at step 40 (94 -> 0,
                               # 97 diodes) and the post-route count was 0 regardless.

# 10 -> 0 (job 5335, run against config.yaml). Kept in lockstep -- see the
# long-form rationale there: this is OpenROAD's own repair_antennas
# -ratio_margin at step 40, default 0, and HIGHER values are MORE
# conservative (more nets flagged, more diodes, more legalization pressure).
# Job 5335 hit DPL-0036 at the SE die corner after the margin drove repair
# down to just 6 remaining violations -- dropping to OpenROAD's own default
# trades a few more non-fatal residual violations for legalization headroom.
DRT_ANTENNA_REPAIR_MARGIN: 0 # %

# ---------------------------------------------------------------------------
# ANTENNA REPAIR -- Odb.HeuristicDiodeInsertion, TRIED AND BACKED OUT
# ---------------------------------------------------------------------------
#
# Kept in lockstep with config.yaml -- see the long-form rationale there.
# Summary: a23ca8f enabled RUN_HEURISTIC_DIODE_INSERTION to close 13 known
# net/pin antenna violations (all "(Side area)" perimeter-ratio failures
# against a 400 limit). On this 1650x1100um die (1.5M+ um of routed
# wirelength), HEURISTIC_ANTENNA_THRESHOLD did not behave like a "sweep up the
# near-misses" knob at any value tried:
#
#   HEURISTIC_ANTENNA_THRESHOLD: 20    -> 45,292 diodes (job 5317)
#   HEURISTIC_ANTENNA_THRESHOLD: 30    -> 41,617 diodes (job 5318, barely fewer)
#   unset (adaptive default, ~130um)   -> 25,191 diodes (job 5320)
#
# All three are three-plus orders of magnitude past the low-dozens the 13
# violations implied. Job 5320 (the adaptive default) got furthest: it reached
# OpenROAD.DetailedPlacement legalizing the flood and failed outright with
# DPL-0036 after ~21 minutes, unable to place a long tail of ANTENNA_* diode
# instances. The step 40 OpenROAD.RepairAntennas pass (still active above,
# DRT_ANTENNA_REPAIR_ITERS/MARGIN) is reactive rather than this pre-route
# heuristic, but it is what the design actually ships with while this is
# unresolved -- see the antenna violation count in the latest signoff report
# before assuming the 13 are still outstanding.
#
# Revisit only with a plan for why HeuristicDiodeInsertion floods this design
# specifically (net topology? wrong units for GRT-based length here?) -- not by
# guessing another threshold value. RUN_HEURISTIC_DIODE_INSERTION intentionally
# left out entirely rather than set to false, so its absence is visible next to
# this note instead of one flag among many.

# ---------------------------------------------------------------------------
# STA Lib Setup
# ---------------------------------------------------------------------------
# gf180mcu_fd_sc_mcu7t5v0 is characterized at 3v30 as well as 5v00 -- the
# "5v0" in the library name is the device flavour, not a mandatory rail.
# The SRAM is 3.3V only, so the whole macro signs off at 3.3V.#

DEFAULT_CORNER: nom_tt_025C_3v30
STA_CORNERS:
  - nom_tt_025C_3v30
  - min_ff_n40C_3v60
