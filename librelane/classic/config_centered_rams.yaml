# GF180MCU LibreLane config -- classic flow for the grouper_soc_chip_core macro
#
# ###########################################################################
# VARIANT OF config.yaml: INTEGRATION-EQUIVALENT SRAM PLACEMENT
#
# Purpose: A/B the RAM macro position against config.yaml. This file is a
# byte-for-byte copy of config.yaml except for the four `location:` values in
# the MACROS block (and the comments explaining them). Same RTL, same SDC,
# same pin order, same PDN -- pdn_cfg.tcl and every PDN_* variable are
# untouched, per the constraint that the PDN is not to be re-derived for this
# experiment. Do not let any other knob drift into this file: if it does, the
# run stops being an A/B on macro placement.
#
# The placement CENTRES the macro row in the core, so the placeable sites form
# a closed ring and every die edge keeps a band of rows for its I/O port
# buffers. It started as a mirror of where the Grouper<->Trouper integration
# floorplan (lora-mimo/integration/pd/config_landscape_2235.yaml) puts these
# same four macros inside Grouper's lobe of the shared 2235x2235 die -- hard
# against the NE corner -- but that arrangement leaves 7.23um above the row and
# 9.92um east of it, both under the 10um halo, so cut_rows emits no row on the
# north or east edge and Repair Design's port buffers there cannot legalize.
# Full derivation, and the NE mapping it supersedes, are in the MACROS block.
#
# Baseline to compare against: job 4851 (run tag `m2_noextend`), which is this
# tree's RTL and config.yaml with only PRIMARY_GDSII_STREAMOUT_TOOL differing.
#
# RUN HISTORY
#   job 5139  MACROS only, pin order carried over unchanged -> FAILED at stage
#             30, DPL-0036 on the 5 input buffers of north-edge input ports.
#             Power grid was clean (0 violations on both nets), so the PDN
#             question this file was written to answer is settled: the macros
#             can move without touching the PDN.
#   job 5140  + IO_PIN_ORDER_CFG re-tuned (pin_order_int_ram.cfg), moving the
#             inputs off the north edge -> FAILED at stage 30, DPL-0036 again,
#             now on output65..output128, the port buffers of the pu/pd outputs
#             that took the north edge instead. Same failure, different port
#             list: the north edge has no rows at all past x=358, so pin order
#             only changes WHICH ports are stranded. Power grid clean again.
#   job 5141  MACROS re-centred (this file), tag int_ram_centre -> PASSED. Exit
#             0 in 7m35s, empty error.log. cut_rows gave 410 rows / 477,936
#             sites in a closed ring (at y~600: x [6.7-177.5] and
#             [1463.3-1643.0], i.e. rows on both sides where the NE placement
#             had none). Signoff: LVS "Circuits match uniquely" 0 errors, route
#             DRC 0 (iter 4), Magic DRC 0, KLayout DRC 0, XOR 0, power grid 0 on
#             both nets, setup +19.57ns nom_tt / +33.48ns min_ff, hold +0.82 /
#             +0.37ns, 0 violations either way, utilisation 68.6%. Against job
#             4851: timing and DRC equal or better, antenna 8 violating nets vs
#             22 (289 diodes vs 108), route wirelength 1,520,097 vs 1,369,917
#             (+11%, the cost of the macro band bisecting the core).
#             The x translation was exactly one PDN_VPITCH, so the Metal4
#             lattice saw an identical macro phase to 5139/5140 and the PDN
#             question stayed settled -- 0 power-grid violations confirmed it.
#             IO_PIN_ORDER_CFG left on pin_order_int_ram.cfg so MACROS was the
#             only change from 5140; with rows on all four edges pin_order_row4
#             should work too, and is the config.yaml/4851 comparison point.
#             Full write-up: librelane/classic/runs/int_ram_centre/RUN_INFO.md
# ###########################################################################
meta:
  version: 3
  flow: Classic
  substituting_steps:
    # Skip Yosys unmapped cells check as it incorrectly flags submodules due to them starting with $ (e.g. $paramod$...)
    # Also even if it didn't flag it, it wouldn't check submodules for unmapped cells
    Checker.YosysUnmappedCells: null

    # Ignore yosys warnings about signal used by no driver
    # Warning: Wire $paramod$1.../small_sync_fifo.sv:53$1261 [31] is used but has no driver.
    # TODO: figure out why yosys is sad
    Checker.YosysSynthChecks: null

    # Why is this checker broken?
    # Probably submodules???????
    # OpenROAD.CheckMacroInstances: null

    # Disable KLayout DRC
    #KLayout.DRC: null
    #Checker.KLayoutDRC: null

    # Disable KLayout antenna check
    #KLayout.Antenna: null
    #Checker.KLayoutAntenna: null

    # Disable KLayout density check
    #KLayout.Density: null
    #Checker.KLayoutDensity: null

    # Save time during development
    # Enable for sign-off
    #OpenROAD.IRDropReport: null

    #Magic.DRC: null
    #Checker.MagicDRC: null

    #KLayout.XOR: null
    #Netgen.LVS: null
    #Checker.LVS: null


