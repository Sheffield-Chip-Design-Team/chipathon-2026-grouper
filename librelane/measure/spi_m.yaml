# Synthesis-only area measurement for the SPI master block.
#
# Not a hardening config: no floorplan, no PDN, never taped out. Its only job
# is to produce a "Chip area for top module" line so the block's gate count can
# be read out. Run with `make measure-ge`; see README.md in this directory.
#
# Note the file/module name mismatches in hw/rtl/spi_m: spi_m_clk_div.sv
# declares `spi_clk_div`, and spi_m_core.sv declares `spi_master`. The list
# below is by file, so it resolves regardless.

DESIGN_NAME: ahb_spi_m

VERILOG_FILES:
- dir::../../hw/rtl/ahb3lite/ahb3lite_pkg.sv
- dir::../../hw/rtl/common/downcounter.sv
- dir::../../hw/rtl/common/shift_reg.sv
- dir::../../hw/rtl/common/small_sync_fifo.sv
- dir::../../hw/rtl/spi_m/spi_m_clk_div.sv
- dir::../../hw/rtl/spi_m/spi_m_tx.sv
- dir::../../hw/rtl/spi_m/spi_m_rx.sv
- dir::../../hw/rtl/spi_m/spi_m_core.sv
- dir::../../hw/rtl/spi_m/ahb_spi_m.sv

USE_SLANG: true

# Match librelane/classic/config.yaml so the numbers are comparable to what the
# block will cost once it is instantiated in the SoC.
CLOCK_PORT: HCLK
CLOCK_PERIOD: 62.5          # 16 MHz
SYNTH_STRATEGY: "AREA 0"
MAX_FANOUT_CONSTRAINT: 16
